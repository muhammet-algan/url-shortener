# ============================================
#  URL Shortener — Docker Compose
#  Services: PostgreSQL, Redis, 2x Spring Boot, Nginx
# ============================================

services:

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: urlshortener-postgres
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urlshortener-network

  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urlshortener-network

  # ── Spring Boot App — Instance 1 ──
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-app-1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: http://localhost
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urlshortener-network
    restart: unless-stopped

  # ── Spring Boot App — Instance 2 ──
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-app-2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: http://localhost
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urlshortener-network
    restart: unless-stopped

  # ── Nginx Load Balancer ──
  nginx:
    image: nginx:alpine
    container_name: urlshortener-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    networks:
      - urlshortener-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  urlshortener-network:
    driver: bridge
