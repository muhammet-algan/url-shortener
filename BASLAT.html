<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost/">
    <title>URL Shortener - Başlatılıyor</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>URL Shortener Uygulamasına Yönlendiriliyorsunuz...</p>
        <p style="font-size: 0.8rem; color: #5a5a6e;">Lütfen Docker'ın çalıştığından emin olun.</p>
    </div>
</body>
</html>
